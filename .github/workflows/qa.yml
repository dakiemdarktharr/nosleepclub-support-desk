name: Local-equivalent QA
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AI_PROVIDER: mock
      AI_MAX_ATTEMPTS: "0"
      MONGODB_URI: ""
      OPENAI_API_KEY: ""
      SUPPORT_STORAGE: memory-demo
      SUPPORT_ACCESS_MODE: public-demo
      NEXT_TELEMETRY_DISABLED: "1"
      SUPPORT_E2E_PRODUCTION: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node --test scripts/mongo-smoke-guard.test.mjs scripts/development-report.test.mjs
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:persistence
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --project=chromium
      - run: npm run test:e2e -- --project=mobile
